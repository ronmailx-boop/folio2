# פריסה אוטומטית בכל push ל-main: בדיקות, מיגרציות חדשות, wrangler deploy.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: בדיקות
        run: npm run check

      - name: האם Cloudflare מוגדר?
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::לא הוגדרו CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. מדלג על פריסה. ראו README.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: איתור D1 ו-R2
        id: res
        if: steps.cf.outputs.ok == 'true'
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: node scripts/ci-resources.mjs

      - name: מיגרציות
        if: steps.res.outputs.found == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: פריסה
        if: steps.res.outputs.found == 'true'
        run: npx wrangler deploy
