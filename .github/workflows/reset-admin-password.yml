# איפוס סיסמת מנהל (כשאין גישה ללוח).
# 1. עדכנו את ה-Secret ADMIN_PASSWORD לסיסמה החדשה.
# 2. הריצו את ה-workflow הזה. אפשר להזין מייל אחר; ברירת המחדל היא ADMIN_EMAIL.
# אם המשתמש לא קיים, הוא נוצר. כל המכשירים המחוברים מנותקים.
name: Reset admin password

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'מייל המשתמש (ריק = ה-Secret ADMIN_EMAIL)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: איתור D1
        id: res
        run: node scripts/ci-resources.mjs
      - name: איפוס סיסמה
        if: steps.res.outputs.found == 'true'
        env:
          ADMIN_EMAIL: ${{ inputs.email || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node scripts/admin-user-sql.mjs --reset > admin.sql
          npx wrangler d1 execute DB --remote --file admin.sql
          rm -f admin.sql
          echo "### ✅ הסיסמה אופסה עבור $ADMIN_EMAIL" >> "$GITHUB_STEP_SUMMARY"
      - name: נכשל
        if: steps.res.outputs.found != 'true'
        run: |
          echo "::error::לא נמצא מסד נתונים. הריצו קודם את Setup."
          exit 1
